name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockpilot
          POSTGRES_PASSWORD: stockpilot
          POSTGRES_DB: stockpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockpilot -d stockpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_test
      TEST_DATABASE_URL: postgresql+psycopg://stockpilot:stockpilot@localhost:5432/stockpilot_test
      REQUIRE_POSTGRES_TESTS: "1"
      SECRET_KEY: ci-only-secret-key-change-before-deployment
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
