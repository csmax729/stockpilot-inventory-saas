openapi: 3.1.0
info:
  title: StockPilot API
  version: 1.0.0
  description: |
    Multi-tenant order and inventory SaaS. All tenant-scoped resources enforce
    current-user membership and role permissions in addition to path parameters.
    Monetary values are in integer minor currency units. Quantities are integers.
servers:
  - url: https://api.stockpilot.example
    description: Placeholder production hostname
  - url: http://localhost:8000
    description: Local development
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Organizations
  - name: Members
  - name: Products
  - name: Warehouses
  - name: Inventory
  - name: Orders
  - name: Reporting
  - name: Operations
paths:
  /health/live:
    get:
      tags: [Operations]
      summary: Process liveness (no dependency check)
      security: []
      responses:
        '200': {description: Alive}
  /health/ready:
    get:
      tags: [Operations]
      summary: Database readiness (no sensitive details)
      security: []
      responses:
        '200': {description: Ready}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterInput'}
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for short-lived access token and secure refresh cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginInput'}
      responses:
        '200':
          description: Login success. Also sets HttpOnly Secure refresh cookie.
          headers:
            Set-Cookie: {description: 'Two cookies: sp_refresh (HttpOnly, Secure, SameSite=Lax) and signed sp_csrf (readable, Secure, SameSite=Lax); see security design', schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a fresh access token
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Rotated access token and refresh cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current refresh session and clear cookie
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': {description: Session revoked and cookie cleared}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/organizations:
    get:
      tags: [Organizations]
      summary: Organizations accessible to current user
      responses:
        '200':
          description: Membership-scoped organizations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Organization'}
    post:
      tags: [Organizations]
      summary: Create organization and grant creator admin role atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationInput'}
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Organizations]
      summary: Read organization details (member only)
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Organization'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/organizations/{org_id}/members:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Members]
      summary: List team members (admin/manager)
      responses:
        '200':
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Membership'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Members]
      summary: Add existing registered user to organization (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberInput'}
      responses:
        '201':
          description: Membership created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - name: user_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      tags: [Members]
      summary: Change role (admin; cannot remove last admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeRoleInput'}
      responses:
        '200':
          description: Updated membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/products:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Products]
      summary: Search and list products (all members)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: q, in: query, schema: {type: string, maxLength: 100}}
        - {name: active, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Products page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProductPage'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Products]
      summary: Create product (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductInput'}
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/products/{product_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      summary: Retrieve product
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Products]
      summary: Update product fields or deactivate product (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductPatch'}
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/warehouses:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Warehouses]
      summary: List warehouses
      responses:
        '200':
          description: Warehouse list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Warehouse'}
    post:
      tags: [Warehouses]
      summary: Create warehouse (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WarehouseInput'}
      responses:
        '201':
          description: Created warehouse
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Warehouse'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/warehouses/{warehouse_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/WarehouseId'
    patch:
      tags: [Warehouses]
      summary: Update/deactivate warehouse (admin/manager)
      description: Deactivating blocks new orders but permits fulfillment/cancellation of existing orders.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WarehousePatch'}
      responses:
        '200':
          description: Updated warehouse
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Warehouse'}
  /api/v1/organizations/{org_id}/inventory:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Inventory]
      summary: List inventory positions with derived available_qty
      parameters:
        - $ref: '#/components/parameters/WarehouseQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Inventory positions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryPage'}
  /api/v1/organizations/{org_id}/inventory/adjustments:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    post:
      tags: [Inventory]
      summary: Receive or adjust stock, rejecting counts below reserved stock (admin/manager)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdjustmentInput'}
      responses:
        '200':
          description: Updated inventory position
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryPosition'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/inventory/movements:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Inventory]
      summary: View stock movement history (admin/manager)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Stock movement page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockMovementPage'}
  /api/v1/organizations/{org_id}/orders:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Orders]
      summary: List orders (viewer receives redacted customer_email)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: {type: string, enum: [reserved, fulfilled, cancelled]}
      responses:
        '200':
          description: Orders page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPage'}
    post:
      tags: [Orders]
      summary: Create order and reserve all line items in a single transaction (admin/manager/staff)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderInput'}
            example:
              warehouse_id: 624e132d-10d9-4b4d-ad1c-7ebd362c2898
              customer_name: Example Customer
              customer_email: example@example.com
              items:
                - product_id: f4659a85-253a-444f-ac6d-7771ed779c68
                  quantity: 2
      responses:
        '201':
          description: Reserved order; repeated identical idempotency key returns original body/status
          headers:
            Idempotency-Replayed: {description: 'true on replay, otherwise false', schema: {type: boolean}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /api/v1/organizations/{org_id}/orders/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: Read order and line snapshots (viewer receives redacted customer_email)
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/organizations/{org_id}/orders/{order_id}/fulfill:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Transition reserved to fulfilled, decrementing on_hand and reserved together (admin/manager)
      responses:
        '200':
          description: Fulfilled order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/orders/{order_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Cancel reserved order and release stock (admin/manager or creator staff)
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/organizations/{org_id}/analytics/overview:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Reporting]
      summary: Inventory and order dashboard (all members)
      responses:
        '200':
          description: Organization dashboard
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalyticsOverview'}
  /api/v1/organizations/{org_id}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrgId'
    get:
      tags: [Reporting]
      summary: Audit trail (admin/manager)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: sp_refresh
  parameters:
    OrgId:
      name: org_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    WarehouseId:
      name: warehouse_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: order_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 25}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, description: Opaque encoded keyset cursor}
    WarehouseQuery:
      name: warehouse_id
      in: query
      schema: {type: string, format: uuid}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 8-128 character unique key; UUID v4 recommended; retained 7 days
      schema: {type: string, minLength: 8, maxLength: 128}
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Double-submit CSRF token matched against sp_csrf cookie, plus Origin validation
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid request or missing idempotency key
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: Unauthenticated or invalid credentials
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: Authenticated but lacking permission
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: Resource not found or not visible in this organization
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: State conflict, insufficient stock, duplicate or idempotency mismatch
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Validation:
      description: Input validation failure
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: Too many requests
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unavailable:
      description: Dependency unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string, example: INSUFFICIENT_STOCK}
            message: {type: string, example: Requested quantity exceeds available stock}
            request_id: {type: string, format: uuid}
            details: {type: object, additionalProperties: true}
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    User:
      type: object
      required: [id, email, is_active]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        is_active: {type: boolean}
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, writeOnly: true}
    TokenResult:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: bearer}
        expires_in: {type: integer, example: 900}
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        default_currency: {type: string, pattern: '^[A-Z]{3}$', default: INR}
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationInput'
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    Membership:
      type: object
      required: [organization_id, user_id, email, role]
      properties:
        organization_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    Role:
      type: string
      enum: [admin, manager, staff, viewer]
    AddMemberInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/Role'}
    ChangeRoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: {$ref: '#/components/schemas/Role'}
    ProductInput:
      type: object
      additionalProperties: false
      required: [sku, name, unit_price_minor]
      properties:
        sku: {type: string, minLength: 1, maxLength: 80}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null']}
        unit_price_minor: {type: integer, minimum: 0, format: int64}
        low_stock_threshold: {type: integer, minimum: 0, default: 5}
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, organization_id, is_active, created_at]
          properties:
            id: {type: string, format: uuid}
            organization_id: {type: string, format: uuid}
            is_active: {type: boolean}
            created_at: {type: string, format: date-time}
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: [string, 'null']}
        unit_price_minor: {type: integer, minimum: 0, format: int64}
        low_stock_threshold: {type: integer, minimum: 0}
        is_active: {type: boolean}
    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        next_cursor: {type: [string, 'null']}
    WarehouseInput:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code: {type: string, minLength: 1, maxLength: 40}
        name: {type: string, minLength: 1, maxLength: 120}
    Warehouse:
      allOf:
        - $ref: '#/components/schemas/WarehouseInput'
        - type: object
          required: [id, organization_id, is_active]
          properties:
            id: {type: string, format: uuid}
            organization_id: {type: string, format: uuid}
            is_active: {type: boolean}
    WarehousePatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        is_active: {type: boolean}
    InventoryPosition:
      type: object
      required: [product_id, warehouse_id, on_hand_qty, reserved_qty, available_qty]
      properties:
        product_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        on_hand_qty: {type: integer, minimum: 0}
        reserved_qty: {type: integer, minimum: 0}
        available_qty: {type: integer, minimum: 0}
    InventoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/InventoryPosition'}}
        next_cursor: {type: [string, 'null']}
    AdjustmentInput:
      type: object
      additionalProperties: false
      required: [warehouse_id, product_id, delta_on_hand, reason]
      properties:
        warehouse_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        delta_on_hand: {type: integer, not: {const: 0}}
        reason: {type: string, minLength: 3, maxLength: 500}
    StockMovement:
      type: object
      required: [id, product_id, warehouse_id, movement_type, delta_on_hand, delta_reserved, created_at]
      properties:
        id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        order_id: {type: [string, 'null'], format: uuid}
        movement_type: {type: string, enum: [receipt, adjustment, reservation, release, fulfillment]}
        delta_on_hand: {type: integer}
        delta_reserved: {type: integer}
        reason: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
    StockMovementPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/StockMovement'}}
        next_cursor: {type: [string, 'null']}
    OrderLineInput:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 10000}
    OrderInput:
      type: object
      additionalProperties: false
      required: [warehouse_id, customer_name, items]
      properties:
        warehouse_id: {type: string, format: uuid}
        customer_name: {type: string, minLength: 1, maxLength: 160}
        customer_email: {type: [string, 'null'], format: email}
        items:
          type: array
          minItems: 1
          maxItems: 50
          description: Duplicate product_id values are rejected
          items: {$ref: '#/components/schemas/OrderLineInput'}
    OrderLine:
      type: object
      required: [product_id, quantity, unit_price_minor, line_total_minor]
      properties:
        product_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
        unit_price_minor: {type: integer, format: int64}
        line_total_minor: {type: integer, format: int64}
    Order:
      type: object
      required: [id, order_number, organization_id, warehouse_id, status, customer_name, currency, total_minor, items, created_at]
      properties:
        id: {type: string, format: uuid}
        order_number: {type: string}
        organization_id: {type: string, format: uuid}
        warehouse_id: {type: string, format: uuid}
        status: {type: string, enum: [reserved, fulfilled, cancelled]}
        customer_name: {type: string}
        customer_email: {type: [string, 'null'], format: email, description: Redacted for viewer role}
        currency: {type: string, minLength: 3, maxLength: 3}
        total_minor: {type: integer, format: int64}
        items: {type: array, items: {$ref: '#/components/schemas/OrderLine'}}
        created_at: {type: string, format: date-time}
        fulfilled_at: {type: [string, 'null'], format: date-time}
        cancelled_at: {type: [string, 'null'], format: date-time}
    OrderPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Order'}}
        next_cursor: {type: [string, 'null']}
    AnalyticsOverview:
      type: object
      required: [total_orders, reserved_orders, fulfilled_orders, cancelled_orders, low_stock_positions, stock_value_minor, currency]
      properties:
        total_orders: {type: integer}
        reserved_orders: {type: integer}
        fulfilled_orders: {type: integer}
        cancelled_orders: {type: integer}
        low_stock_positions: {type: integer}
        stock_value_minor: {type: integer, format: int64, description: Sum of on_hand_qty x current product unit_price_minor}
        currency: {type: string}
    AuditEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        actor_user_id: {type: string, format: uuid}
        entity_type: {type: string}
        entity_id: {type: string, format: uuid}
        details: {type: object}
        created_at: {type: string, format: date-time}
    AuditPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}
        next_cursor: {type: [string, 'null']}
